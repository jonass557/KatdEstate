# Blueprint de déploiement Render — KatdEstate API
# Documentation : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: katdestate-api
    env: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: npm install --include=dev && npm run build --workspace @rentflow/shared
    startCommand: npm run api:start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: 'true'
      - key: SERVER_URL
        value: https://katdestate-api.onrender.com
      - key: CLIENT_URL
        value: https://katdestate.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: '10000'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: katdestate-api
      - key: JWT_AUDIENCE
        value: katdestate-web
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: COOKIE_NAME
        value: katdestate_refresh
      - key: COOKIE_SECURE
        value: 'true'
      - key: RATE_LIMIT_GENERAL_WINDOW_MS
        value: '60000'
      - key: RATE_LIMIT_GENERAL_MAX
        value: '120'
      - key: RATE_LIMIT_AUTH_WINDOW_MS
        value: '900000'
      - key: RATE_LIMIT_AUTH_MAX
        value: '10'
      - key: RATE_LIMIT_SENSITIVE_WINDOW_MS
        value: '60000'
      - key: RATE_LIMIT_SENSITIVE_MAX
        value: '30'
      - key: LOG_LEVEL
        value: info
      - key: CLOUDINARY_CLOUD_NAME
        value: dq2cw4tyo
      - key: CLOUDINARY_API_KEY
        value: '822762149564633'
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: kadtestate
