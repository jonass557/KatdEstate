name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
        env:
          NODE_ENV: test
          # Valeurs de test uniquement : aucune donnée réelle, aucun secret partagé.
          JWT_ACCESS_SECRET: ci-access-secret-value-not-a-real-secret
          JWT_REFRESH_SECRET: ci-refresh-secret-value-not-a-real-secret
